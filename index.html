<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Blog CMS Frontend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { font-family: 'Inter', sans-serif; }
        .post-card { 
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out; 
        }
        .post-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.1); 
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-left-color: #a78bfa; 
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen p-4 sm:p-8 text-gray-100">

    <div class="max-w-4xl mx-auto">
        <header class="text-center py-6 mb-10 border-b border-purple-500/50">
            <h1 class="text-5xl font-extrabold text-purple-400">Simple Blog CMS</h1>
            <p class="text-gray-400 mt-2">Powered by FastAPI and JavaScript</p>
        </header>

        <div id="message-box" class="hidden fixed top-4 right-4 p-4 rounded-lg shadow-xl text-white font-semibold z-50 transition-opacity duration-300"></div>

        <section class="mb-12 bg-gray-800 p-8 rounded-2xl shadow-2xl border border-purple-800">
            <h2 class="text-3xl font-bold text-purple-400 mb-6">Create New Post</h2>
            <form id="create-post-form" class="space-y-4">
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-300 mb-1">Title</label>
                    <input type="text" id="title" required class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-xl text-white focus:ring-purple-500 focus:border-purple-500 placeholder-gray-400" placeholder="A catchy title for your post">
                </div>
                <div>
                    <label for="content" class="block text-sm font-medium text-gray-300 mb-1">Content</label>
                    <textarea id="content" required rows="5" class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-xl text-white focus:ring-purple-500 focus:border-purple-500 placeholder-gray-400" placeholder="Write your amazing content here..."></textarea>
                </div>
                <button type="submit" id="submit-button" class="w-full flex justify-center items-center px-6 py-3 bg-purple-600 text-white font-medium rounded-xl hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 focus:ring-offset-gray-900 transition duration-200 shadow-md hover:shadow-lg">
                    <span id="button-text">Publish Post</span>
                    <div id="loading-spinner" class="spinner ml-3 hidden"></div>
                </button>
            </form>
        </section>

        <section>
            <h2 class="text-3xl font-bold text-gray-300 mb-8">Recent Posts</h2>
            <div id="posts-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <p id="loading-message" class="text-center text-gray-500 col-span-full">Loading posts...</p>
            </div>
        </section>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000';
        const postsContainer = document.getElementById('posts-container');
        const form = document.getElementById('create-post-form');
        const submitButton = document.getElementById('submit-button');
        const buttonText = document.getElementById('button-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        const loadingMessage = document.getElementById('loading-message');
        const messageBox = document.getElementById('message-box');

       
        function showMessage(message, type = 'success') {
            const colors = {
                success: 'bg-emerald-500',
                error: 'bg-red-600'
            };

            messageBox.textContent = message;
            messageBox.className = `fixed top-4 right-4 p-4 rounded-lg shadow-xl text-white font-semibold z-50 transition-opacity duration-300 ${colors[type]}`;
            messageBox.style.opacity = '1';
            messageBox.classList.remove('hidden');

            setTimeout(() => {
                messageBox.style.opacity = '0';
                setTimeout(() => messageBox.classList.add('hidden'), 300);
            }, 4000);
        }

       
        function renderPostCard(post) {
            const formattedDate = new Date(post.created_at).toLocaleDateString('en-US', {
                year: 'numeric', month: 'short', day: 'numeric'
            });

            return `
                <div class="post-card bg-gray-800 p-6 rounded-2xl shadow-xl border border-purple-800 hover:border-purple-600 transition duration-200">
                    <h3 class="text-2xl font-semibold text-purple-400 mb-2">${post.title}</h3>
                    <p class="text-sm text-gray-500 mb-4">By ${post.author} on ${formattedDate}</p>
                    <p class="text-gray-300 line-clamp-4 mb-4">${post.content}</p>
                    <div class="flex justify-between items-center text-xs text-gray-600 border-t border-gray-700 pt-3">
                        <span>ID: ${post.id.substring(0, 8)}...</span>
                        <button onclick="deletePost('${post.id}')" class="text-red-400 hover:text-red-500 transition duration-150 font-medium p-1 rounded-md hover:bg-red-900/20">Delete</button>
                    </div>
                </div>
            `;
        }

     
        async function fetchAndRenderPosts() {
            loadingMessage.textContent = 'Loading posts...';
            loadingMessage.classList.remove('hidden');
            postsContainer.innerHTML = ''; 

            try {
                const response = await fetch(`${API_BASE_URL}/posts/`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const posts = await response.json();

                if (posts.length === 0) {
                    loadingMessage.textContent = 'No posts found. Be the first to create one!';
                } else {
                    postsContainer.innerHTML = posts.map(renderPostCard).join('');
                    loadingMessage.classList.add('hidden');
                }

            } catch (error) {
                console.error('Error fetching posts:', error);
                loadingMessage.textContent = 'Failed to load posts. Is the FastAPI server running?';
                loadingMessage.classList.add('text-red-600');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitButton.disabled = true;
            buttonText.textContent = 'Publishing...';
            loadingSpinner.classList.remove('hidden');

            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            try {
                const response = await fetch(`${API_BASE_URL}/posts/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });

                if (response.status === 201) {
                    showMessage('Post created successfully!');
                    form.reset();
                    await fetchAndRenderPosts();
                } else {
                    const errorData = await response.json();
                    showMessage(`Error creating post: ${errorData.detail || 'Unknown error'}`, 'error');
                }

            } catch (error) {
                console.error('Network Error:', error);
                showMessage('Network error. Could not connect to the API.', 'error');
            } finally {
                submitButton.disabled = false;
                buttonText.textContent = 'Publish Post';
                loadingSpinner.classList.add('hidden');
            }
        });

        async function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/posts/${postId}`, {
                    method: 'DELETE'
                });

                if (response.status === 204) {
                    showMessage('Post deleted successfully!');
                    await fetchAndRenderPosts();
                } else if (response.status === 404) {
                    showMessage('Post not found (maybe already deleted).', 'error');
                } else {
                    showMessage(`Error deleting post (Status: ${response.status})`, 'error');
                }

            } catch (error) {
                console.error('Network Error:', error);
                showMessage('Network error. Could not connect to the API.', 'error');
            }
        }
        
        window.deletePost = deletePost;

        document.addEventListener('DOMContentLoaded', fetchAndRenderPosts);
    </script>
</body>
</html>
